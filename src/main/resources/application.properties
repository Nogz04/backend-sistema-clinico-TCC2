spring.application.name=backend-TCC-clinicaIA
server.port=${SERVER_PORT:8080}

# Carrega configurações locais ignoradas pelo Git.
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica_IA_TCC?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.1-flash-lite}
gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:PT5S}
gemini.request-timeout=${GEMINI_REQUEST_TIMEOUT:PT40S}
# Resiliencia: total de tentativas (metade no modelo principal, metade no reserva) e espera inicial, que dobra a cada falha.
gemini.max-attempts=${GEMINI_MAX_ATTEMPTS:4}
gemini.retry-delay=${GEMINI_RETRY_DELAY:PT1S}
# Controle de tokens: teto de saida, orcamento de raciocinio (0 desliga; negativo nao envia),
# limite de caracteres da transcricao, cota diaria por medico (0 = sem limite) e identificacao de falantes.
gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:8192}
gemini.thinking-budget=${GEMINI_THINKING_BUDGET:0}
gemini.max-input-chars=${GEMINI_MAX_INPUT_CHARS:20000}
gemini.daily-token-limit-per-doctor=${GEMINI_DAILY_TOKEN_LIMIT:0}
gemini.identificar-falas=${GEMINI_IDENTIFICAR_FALAS:true}

# Convites
app.frontend.url=${FRONTEND_URL:http://localhost:5500}
app.invite.expiration=${INVITE_EXPIRATION:PT24H}
app.invite.expose-link=${EXPOSE_INVITE_LINK:false}
app.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:PT30M}
app.password-reset.expose-link=${EXPOSE_PASSWORD_RESET_LINK:false}
app.mail.enabled=${MAIL_ENABLED:false}

# SMTP
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
