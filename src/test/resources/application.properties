spring.datasource.url=jdbc:h2:mem:clinica_IA_TCC_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

app.jwt.secret=test-secret-with-at-least-thirty-two-characters-123456
app.jwt.expiration=PT1H
app.cors.allowed-origins=http://localhost:5500
gemini.api-key=
gemini.model=modelo-principal-teste
gemini.fallback-model=modelo-reserva-teste
gemini.max-attempts=4
gemini.retry-delay=PT0S
gemini.thinking-budget=0
gemini.max-output-tokens=8192
gemini.max-input-chars=2000
gemini.connect-timeout=PT1S
gemini.request-timeout=PT1S
app.mail.enabled=false
app.invite.expose-link=true
app.frontend.url=http://localhost:5500
app.invite.expiration=PT24H
app.password-reset.expiration=PT30M
app.password-reset.expose-link=true
